<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F0EFEA">
<title>М× РАДИО — Механика</title>
<style>
@font-face{
  font-family:'Monocraft Radio';
  src:local('Monocraft'),
      url('https://cdn.jsdelivr.net/gh/IdreesInc/Monocraft@main/dist/Monocraft-ttf/Monocraft.ttf') format('truetype');
  font-style:normal;
  font-weight:500;
  font-display:swap;
}
:root {color-scheme:light;--paper:#F0EFEA;--lcd:#FFBC35;--ink:#3c3c3c}
* {box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--paper)}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#484640}
.shell{min-height:100svh;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:clamp(8px,3vw,28px) 10px 35px}
.radio{position:relative;width:min(100%,640px);aspect-ratio:1;container-type:inline-size;isolation:isolate;-webkit-user-select:none;user-select:none;touch-action:manipulation}
.radio img{display:block;user-select:none;-webkit-user-drag:none;pointer-events:none}
.base{width:100%;height:100%;position:absolute;inset:0}
.sprite{position:absolute;height:auto;max-width:none;transition:none}
.power-art{left:14.53125%;top:38.59375%;width:25.9375%}
.mode-art{left:43.59375%;top:45.9375%;width:46.5625%}
.hit{position:absolute;padding:0;border:0;appearance:none;-webkit-appearance:none;background:transparent;color:transparent;cursor:pointer;touch-action:manipulation}
.hit:focus-visible{outline:3px solid #2A65C7;outline-offset:4px;border-radius:9px}
.hit-power{left:15.7%;top:39.7%;width:22.6%;height:22.2%;border-radius:12%}
.hit-mode-work{left:44.6%;top:46.92%;width:20.7%;height:5.75%;border-radius:12px}
.hit-mode-nonwork{left:66.15%;top:46.92%;width:20.7%;height:5.75%;border-radius:12px}
.hit:active{filter:brightness(0.98)}
.screen{position:absolute;left:12.5%;top:25.87%;width:72.35%;height:8.5%;overflow:hidden;border-radius:1.7cqw;pointer-events:none;display:flex;align-items:center;color:var(--lcd);font-family:'Monocraft Radio','Monocraft',monospace;font-weight:500;font-size:3.90625cqw;line-height:1;white-space:nowrap;padding-top:1.1cqw;font-variant-ligatures:none;font-synthesis:none}
.lcd-left{flex:none;margin-left:3.1cqw;white-space:nowrap;letter-spacing:0}
.lcd-viewport{position:relative;flex:1;align-self:stretch;min-width:0;overflow:hidden;margin-left:0.45cqw;margin-right:1.9cqw;visibility:hidden}
.lcd-viewport.visible{visibility:visible}
.lcd-scroll{position:absolute;left:0;top:0.22cqw;height:100%;width:max-content;white-space:nowrap;display:flex;align-items:center;will-change:transform;transform:translateX(1000px);letter-spacing:0}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
@media(prefers-reduced-motion:reduce){.lcd-scroll{will-change:auto}}
</style>
</head>
<body>
<main class="shell">
  <div class="radio" id="radio" aria-label="Механика радио">
    <img class="base" src="assets/radio-base.png" alt="Корпус радио «Механика» с цифровым дисплеем и решёткой динамика" draggable="false">
    <img class="sprite power-art" id="power-art" src="assets/power-off.png" alt="" draggable="false">
    <img class="sprite mode-art" id="mode-art" src="assets/mode-work.png" alt="" draggable="false">
    <div class="screen" aria-hidden="true">
      <span class="lcd-left" id="lcd-left">HELLO</span>
      <span class="lcd-viewport" id="lcd-viewport"><span class="lcd-scroll" id="lcd-scroll"></span></span>
    </div>
    <button class="hit hit-power" id="power-button" type="button" aria-label="Включить радио" aria-pressed="false" title="Включить или остановить воспроизведение"></button>
    <button class="hit hit-mode-work" id="work-button" type="button" aria-label="Плейлист Работа" aria-pressed="true" title="Работа"></button>
    <button class="hit hit-mode-nonwork" id="nonwork-button" type="button" aria-label="Плейлист Неработа" aria-pressed="false" title="Неработа"></button>
  </div>
  <div id="track-status" class="sr-only" role="status" aria-live="polite"></div>
</main>
<audio id="audio" preload="none"></audio>
<script>
(()=>{
'use strict';
const REPO='Andrusha109/audio';
const BRANCH='main';
const RAW='https://raw.githubusercontent.com/'+REPO+'/'+BRANCH+'/';
const API='https://api.github.com/repos/'+REPO+'/contents';
const FALLBACK={
  work:Array.from({length:23},(_,i)=>({name:(i+1)+'.mp3',url:RAW+(i+1)+'.mp3'})),
  nonwork:[{name:'02-Rude-Crude-Lude.mp3',url:RAW+'nonwork/02-Rude-Crude-Lude.mp3'}]
};
const ART={powerOn:'assets/power-on.png',powerOff:'assets/power-off.png',modeWork:'assets/mode-work.png',modeNonwork:'assets/mode-nonwork.png'};
const PHRASES=[
  'НАСТРОЕНО ПО СЛУХУ',
  'АЛГОРИТМ СЕГОДНЯ ОТДЫХАЕТ',
  'НЕ ЗНАКОМО? ТЕМ ЛУЧШЕ',
  'МУЗЫКА РУЧНОЙ СБОРКИ',
  'СЛЕДУЮЩИЙ ТРЕК — СЮРПРИЗ',
  'РИТМ-СЕКЦИЯ ЗНАЕТ, ЧТО ДЕЛАТЬ',
  'ТАНЦЕВАТЬ НЕ ОБЯЗАТЕЛЬНО',
  'МОЖНО ЧУТЬ ГРОМЧЕ',
  'ПЕРЕМЕШАНО СО ВКУСОМ',
  'РАБОТАЕТ ДАЖЕ В НЕРАБОТЕ',
  'СЛУЧАЙНОСТИ ПРИВЕТСТВУЮТСЯ',
  'ПРОВЕРЕНО НА УШАХ',
  'ЭКЛЕКТИКА — ЭТО НОРМАЛЬНО',
  'ВЫ ПОЙМАЛИ ВОЛНУ'
];
const $=id=>document.getElementById(id);
const audio=$('audio'), powerArt=$('power-art'), modeArt=$('mode-art');
const statusText=$('lcd-left'), viewport=$('lcd-viewport'), scroll=$('lcd-scroll');
const powerBtn=$('power-button'), workBtn=$('work-button'), nonworkBtn=$('nonwork-button');
const trackStatus=$('track-status');
let mode='work';
let phase='hello'; // hello | connecting | playing | stop | error
let generation=0; // invalidates asynchronous work from previous sessions
let requestId=0; // invalidates events/promises from previous tracks
let activeUrl='';
let attempts=0;
let connectingTimeout=null;
let tickerRaf=0, tickerLastTime=null, tickerX=0, tickerRunning=false;
let lastPhrase=-1, phraseBag=[];
const catalogs={work:FALLBACK.work.slice(),nonwork:FALLBACK.nonwork.slice()};
const queue={work:[],nonwork:[]};
const lastUrl={work:'',nonwork:''};
const nameFor=m=>m==='work'?'Работа':'Неработа';
const active=()=>phase==='playing'||phase==='connecting';
audio.volume=0.75;
audio.preload='none';
function announce(message){trackStatus.textContent=message;}
function applyVisualState(){
  powerArt.src=active()?ART.powerOn:ART.powerOff;
  modeArt.src=mode==='work'?ART.modeWork:ART.modeNonwork;
  powerBtn.setAttribute('aria-pressed',String(active()));
  powerBtn.setAttribute('aria-label',active()?'Остановить радио':'Включить радио');
  workBtn.setAttribute('aria-pressed',String(mode==='work'));
  nonworkBtn.setAttribute('aria-pressed',String(mode==='nonwork'));
  statusText.textContent=phase==='playing'?'ON AIR:':phase==='connecting'?'CONNECTING':phase==='stop'?'STOP':phase==='error'?'ERROR':'HELLO';
  const shouldTick=phase==='playing';
  viewport.classList.toggle('visible',shouldTick);
  if(shouldTick&&!tickerRunning)startTicker();
  if(!shouldTick&&tickerRunning)stopTicker();
}
function setPhase(next){phase=next;applyVisualState()}
function fisherYates(items){let a=items.slice();for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a}
function pickTrack(){
  const arr=catalogs[mode];if(!arr.length)return null;
  const current=queue[mode];
  if(!current.length){
    current.push(...fisherYates(arr));
    if(current.length>1 && current[current.length-1].url===lastUrl[mode]){
      let i=current.findIndex(x=>x.url!==lastUrl[mode]);
      [current[i],current[current.length-1]]=[current[current.length-1],current[i]];
    }
  }
  const track=current.pop();lastUrl[mode]=track.url;return track;
}
function clearTimeoutSafe(){if(connectingTimeout){clearTimeout(connectingTimeout);connectingTimeout=null;}}
function releaseAudio(){
  ++requestId;
  clearTimeoutSafe();
  audio.pause();
  audio.removeAttribute('src');
  audio.load();
  activeUrl='';
}
function stopRadio(){
  ++generation;
  releaseAudio();
  attempts=0;
  setPhase('stop');
  announce('Остановлено · '+nameFor(mode));
}
function failTrack(token,request,why){
  if(token!==generation||request!==requestId||!active())return;
  if(attempts>=Math.max(2,Math.min(5,catalogs[mode].length))){
    ++generation;
    releaseAudio();
    setPhase('error');
    announce('Не удалось загрузить музыку. Проверь интернет и нажми Play ещё раз.');
    return;
  }
  playTrack(token);
}
function playTrack(token){
  if(token!==generation)return;
  clearTimeoutSafe();
  const request=++requestId;
  const track=pickTrack();
  if(!track){setPhase('error');announce('В плейлисте нет аудиофайлов');return;}
  attempts++;
  audio.pause();
  audio.removeAttribute('src');
  audio.src=track.url;
  activeUrl=track.url;
  setPhase('connecting');
  announce('Подключение · '+nameFor(mode)+' · '+track.name);
  // Browsers can stall on large raw MP3s without emitting an error event.
  connectingTimeout=setTimeout(()=>failTrack(token,request,'timeout'),25000);
  let playPromise;
  try {playPromise=audio.play();}
  catch(err){failTrack(token,request,err);return;}
  if(playPromise&&typeof playPromise.catch==='function'){
    playPromise.catch(err=>{
      if(token!==generation||request!==requestId||!active())return;
      if(err?.name==='AbortError')return;
      if(err?.name==='NotAllowedError'){
        ++generation;releaseAudio();setPhase('error');
        announce('Браузер не разрешил воспроизведение. Нажми Play ещё раз.');
      }else failTrack(token,request,err);
    });
  }
}
function startRadio(){
  if(active())return;
  ++generation;
  const token=generation;
  attempts=0;
  playTrack(token);
}
function chooseMode(next){
  if(mode===next)return;
  const restart=active();
  ++generation;
  releaseAudio();
  mode=next;
  attempts=0;
  if(restart){
    playTrack(generation);
  }else{
    applyVisualState(); // preserve HELLO / STOP / ERROR
    announce('Выбрана «'+nameFor(mode)+'» · '+catalogs[mode].length+' трек(ов)');
  }
}
// A single, static "ON AIR:" is kept outside the clipped scrolling region.
// The text starts just beyond the RIGHT edge and disappears at the LEFT edge,
// which is immediately after the colon.
function nextPhrase(){
  if(!phraseBag.length){
    phraseBag=fisherYates(PHRASES.map((_,i)=>i));
    if(phraseBag.length>1 && phraseBag[phraseBag.length-1]===lastPhrase){
      const k=phraseBag.findIndex(i=>i!==lastPhrase);
      [phraseBag[k],phraseBag[phraseBag.length-1]]=[phraseBag[phraseBag.length-1],phraseBag[k]];
    }
  }
  lastPhrase=phraseBag.pop();
  scroll.textContent=PHRASES[lastPhrase];
  tickerX=viewport.clientWidth+10;
  scroll.style.transform='translate3d('+tickerX+'px,0,0)';
}
function tick(time){
  if(!tickerRunning)return;
  if(tickerLastTime!==null){
    const seconds=Math.min(0.1,(time-tickerLastTime)/1000);
    tickerX-=Math.max(20,viewport.clientWidth*0.16)*seconds;
    scroll.style.transform='translate3d('+tickerX+'px,0,0)';
    if(tickerX<-scroll.getBoundingClientRect().width-3) nextPhrase();
  }
  tickerLastTime=time;
  tickerRaf=requestAnimationFrame(tick);
}
function stopTicker(){
  tickerRunning=false;
  cancelAnimationFrame(tickerRaf);
  tickerLastTime=null;
}
function startTicker(){
  tickerRunning=true;
  tickerLastTime=null;
  nextPhrase();
  tickerRaf=requestAnimationFrame(tick);
}
function refreshCounts(){
  if(!active())announce(nameFor(mode)+' · '+catalogs[mode].length+' трек(ов) · готово');
}
// Discover new tracks without requiring a redeploy. Fallback catalogs work
// even if the unauthenticated GitHub API is rate-limited or unavailable.
async function syncCatalog(channel,path){
  try{
    const response=await fetch(API+path+'?ref='+BRANCH,{cache:'no-store'});
    if(!response.ok)throw new Error('GitHub API '+response.status);
    const files=await response.json();
    if(!Array.isArray(files))return;
    const found=files.filter(f=>f.type==='file'&&/\.(mp3|m4a|ogg|wav)$/i.test(f.name)&&f.download_url)
      .sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true}))
      .map(f=>({name:f.name,url:f.download_url}));
    if(!found.length)return;
    // Catalog changes do not interrupt a playing song. New songs join the next shuffle cycle.
    const oldUrls=new Set(catalogs[channel].map(x=>x.url));
    catalogs[channel]=found;
    if(found.some(x=>!oldUrls.has(x.url))) queue[channel]=[];
    refreshCounts();
  }catch(err){/* verified fallback remains available */}
}
audio.addEventListener('playing',()=>{
  if(phase==='connecting'&&activeUrl===audio.src){
    clearTimeoutSafe();attempts=0;
    setPhase('playing');
    announce('В эфире · '+nameFor(mode)+' · '+(lastUrl[mode].split('/').pop()||''));
  }
});
audio.addEventListener('waiting',()=>{
  if(phase==='playing'){setPhase('connecting');announce('Буферизация · '+nameFor(mode));}
});
audio.addEventListener('ended',()=>{
  if(!active())return;
  attempts=0;
  playTrack(generation);
});
audio.addEventListener('error',()=>{
  if(active()&&activeUrl&&audio.error)failTrack(generation,requestId,audio.error);
});
powerBtn.addEventListener('click',()=>active()?stopRadio():startRadio());
workBtn.addEventListener('click',()=>chooseMode('work'));
nonworkBtn.addEventListener('click',()=>chooseMode('nonwork'));
applyVisualState();
Promise.allSettled([syncCatalog('work',''),syncCatalog('nonwork','/nonwork')]);
// This diagnostic hook is read-only and is useful when testing in devtools.
window.__radioDebug=()=>({mode,phase,currentAudio:audio.currentSrc,workCount:catalogs.work.length,nonworkCount:catalogs.nonwork.length,queueLengths:{work:queue.work.length,nonwork:queue.nonwork.length}});
})();
</script>
</body>
</html>
