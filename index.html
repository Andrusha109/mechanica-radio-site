:root {color-scheme:light;--paper:#F0EFEA;--lcd:#FFBC35;--ink:#3c3c3c}

const $=id=>document.getElementById(id);
const audio=$('audio'), powerArt=$('power-art'), modeArt=$('mode-art');
const statusText=$('lcd-left'), viewport=$('lcd-viewport'), scroll=$('lcd-scroll');
const powerBtn=$('power-button'), workBtn=$('work-button'), nonworkBtn=$('nonwork-button');
const trackStatus=$('track-status');
let mode='work';

let generation=0; // invalidates asynchronous work from previous sessions
let requestId=0; // invalidates events/promises from previous tracks
let activeUrl='';
let attempts=0;
let connectingTimeout=null;

const queue={work:[],nonwork:[]};
const lastUrl={work:'',nonwork:''};

audio.volume=0.75;
audio.preload='none';
function announce(message){trackStatus.textContent=message;}
function applyVisualState(){
  powerArt.src=active()?ART.powerOn:ART.powerOff;
  modeArt.src=mode==='work'?ART.modeWork:ART.modeNonwork;
  powerBtn.setAttribute('aria-pressed',String(active()));
  powerBtn.setAttribute('aria-label',active()?'Остановить радио':'Включить радио');
  workBtn.setAttribute('aria-pressed',String(mode==='work'));
  nonworkBtn.setAttribute('aria-pressed',String(mode==='nonwork'));
  statusText.textContent=phase==='playing'?'ON AIR:':phase==='connecting'?'CONNECTING':phase==='stop'?'STOP':phase==='error'?'ERROR':'HELLO';

function setPhase(next){phase=next;applyVisualState()}
function fisherYates(items){let a=items.slice();for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a}
function pickTrack(){
  const arr=catalogs[mode];if(!arr.length)return null;
  const current=queue[mode];
  if(!current.length){
    current.push(...fisherYates(arr));
    if(current.length>1 && current[current.length-1].url===lastUrl[mode]){
      let i=current.findIndex(x=>x.url!==lastUrl[mode]);
      [current[i],current[current.length-1]]=[current[current.length-1],current[i]];
    }
  }
  const track=current.pop();lastUrl[mode]=track.url;return track;
}
function clearTimeoutSafe(){if(connectingTimeout){clearTimeout(connectingTimeout);connectingTimeout=null;}}
function releaseAudio(){
  ++requestId;
  clearTimeoutSafe();
  audio.pause();
  audio.removeAttribute('src');
  audio.load();
  activeUrl='';
}
function stopRadio(){
  ++generation;
  releaseAudio();
  attempts=0;
  setPhase('stop');
  announce('Остановлено · '+nameFor(mode));

function failTrack(token,request,why){
  if(token!==generation||request!==requestId||!active())return;
  if(attempts>=Math.max(2,Math.min(5,catalogs[mode].length))){
    ++generation;
    releaseAudio();
    setPhase('error');
    announce('Не удалось загрузить музыку. Проверь интернет и нажми Play ещё раз.');
    return;
  }
  playTrack(token);
}
function playTrack(token){
  if(token!==generation)return;
  clearTimeoutSafe();
  const request=++requestId;
  const track=pickTrack();
  if(!track){setPhase('error');announce('В плейлисте нет аудиофайлов');return;}
  attempts++;
  audio.pause();
  audio.removeAttribute('src');
  audio.src=track.url;
  activeUrl=track.url;
  setPhase('connecting');
  announce('Подключение · '+nameFor(mode)+' · '+track.name);
  // Browsers can stall on large raw MP3s without emitting an error event.
  connectingTimeout=setTimeout(()=>failTrack(token,request,'timeout'),25000);
  let playPromise;
  try {playPromise=audio.play();}
  catch(err){failTrack(token,request,err);return;}
  if(playPromise&&typeof playPromise.catch==='function'){
    playPromise.catch(err=>{
      if(token!==generation||request!==requestId||!active())return;
      if(err?.name==='AbortError')return;
      if(err?.name==='NotAllowedError'){
        ++generation;releaseAudio();setPhase('error');
        announce('Браузер не разрешил воспроизведение. Нажми Play ещё раз.');
      }else failTrack(token,request,err);
    });
  }
}
function startRadio(){
  if(active())return;
  ++generation;
  const token=generation;
  attempts=0;
  playTrack(token);
}
function chooseMode(next){
  if(mode===next)return;
  const restart=active();
  ++generation;
  releaseAudio();
  mode=next;
  attempts=0;
  if(restart){
    playTrack(generation);
  }else{
    applyVisualState(); // preserve HELLO / STOP / ERROR
    announce('Выбрана «'+nameFor(mode)+'» · '+catalogs[mode].length+' трек(ов)');
  }

    }
  }
  lastPhrase=phraseBag.pop();
  scroll.textContent=PHRASES[lastPhrase];
  tickerX=viewport.clientWidth+10;
  scroll.style.transform='translate3d('+tickerX+'px,0,0)';
}
function tick(time){
  if(!tickerRunning)return;
  if(tickerLastTime!==null){
    const seconds=Math.min(0.1,(time-tickerLastTime)/1000);
    tickerX-=Math.max(20,viewport.clientWidth*0.16)*seconds;
    scroll.style.transform='translate3d('+tickerX+'px,0,0)';
    if(tickerX<-scroll.getBoundingClientRect().width-3) nextPhrase();
  }
  tickerLastTime=time;
  tickerRaf=requestAnimationFrame(tick);
}
function stopTicker(){
  tickerRunning=false;
  cancelAnimationFrame(tickerRaf);
  tickerLastTime=null;
}
function startTicker(){
  tickerRunning=true;
  tickerLastTime=null;
  nextPhrase();
  tickerRaf=requestAnimationFrame(tick);
}
function refreshCounts(){
  if(!active())announce(nameFor(mode)+' · '+catalogs[mode].length+' трек(ов) · готово');
}
// Discover new tracks without requiring a redeploy. Fallback catalogs work
// even if the unauthenticated GitHub API is rate-limited or unavailable.
async function syncCatalog(channel,path){
  try{
    const response=await fetch(API+path+'?ref='+BRANCH,{cache:'no-store'});
    if(!response.ok)throw new Error('GitHub API '+response.status);
    const files=await response.json();
    if(!Array.isArray(files))return;
    const found=files.filter(f=>f.type==='file'&&/\.(mp3|m4a|ogg|wav)$/i.test(f.name)&&f.download_url)
      .sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true}))
      .map(f=>({name:f.name,url:f.download_url}));
    if(!found.length)return;
    // Catalog changes do not interrupt a playing song. New songs join the next shuffle cycle.
    const oldUrls=new Set(catalogs[channel].map(x=>x.url));
    catalogs[channel]=found;
    if(found.some(x=>!oldUrls.has(x.url))) queue[channel]=[];
    refreshCounts();
  }catch(err){/* verified fallback remains available */}
}
audio.addEventListener('playing',()=>{
  if(phase==='connecting'&&activeUrl===audio.src){
    clearTimeoutSafe();attempts=0;
    setPhase('playing');
    announce('В эфире · '+nameFor(mode)+' · '+(lastUrl[mode].split('/').pop()||''));
  }
});
audio.addEventListener('waiting',()=>{
  if(phase==='playing'){setPhase('connecting');announce('Буферизация · '+nameFor(mode));}
});
audio.addEventListener('ended',()=>{
  if(!active())return;
  attempts=0;
  playTrack(generation);
});
audio.addEventListener('error',()=>{
  if(active()&&activeUrl&&audio.error)failTrack(generation,requestId,audio.error);
});
powerBtn.addEventListener('click',()=>active()?stopRadio():startRadio());
workBtn.addEventListener('click',()=>chooseMode('work'));
nonworkBtn.addEventListener('click',()=>chooseMode('nonwork'));
applyVisualState();
Promise.allSettled([syncCatalog('work',''),syncCatalog('nonwork','/nonwork')]);
// This diagnostic hook is read-only and is useful when testing in devtools.
window.__radioDebug=()=>({mode,phase,currentAudio:audio.currentSrc,workCount:catalogs.work.length,nonworkCount:catalogs.nonwork.length,queueLengths:{work:queue.work.length,nonwork:queue.nonwork.length}});
})();
</script>
